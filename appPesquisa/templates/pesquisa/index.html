{% extends "base/estruturaBase.html" %}
{% load static %}


{% block conteudo %}
<div id="formulario">
  Ajude-nos a melhorar o site preenchendo este
  <a href="https://docs.google.com/forms/d/e/1FAIpQLSeOQC1A10TL4Rr9WBQos3DAxQKuxZOvCwOnE9deJCNdMIMPFg/viewform?usp=sharing&ouid=113643081803667711900" target="_blank">formulário</a>.
</div>
<br><br>

<div class="faixa-boas-vindas">

</div>
<br>
<div class="input-container">

              <li><a id="btn-links" class="dropdown-item" href="#">Pesquisar Editais</a></li>
          </ul>

    </div>
</div>



<div id="conteudo-dinamico" class="text-center p-4">
  <img src="https://i.ibb.co/FbcqrSxB/image-removebg-preview-38.png" 
       alt="Imagem inicial" 
       class="img-fluid" 
       style="max-width: 100%; width: 100%; height: auto;">
</div>

{% block scripts %}
<script>
