
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Chamadas Públicas{% endblock %}</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{% static 'css/base/estruturaBase.css' %}">
  <link rel="stylesheet" href="{% static 'css/base/menu.css' %}">
  <link rel="stylesheet" href="{% static 'css/base/contatenos.css' %}">

  {% block estilos %}{% endblock %}
</head>

<body>

  {% include "base/navbar/menu.html" %}

  <div class="container-fluid content-wrapper" style="margin-top:70px;">
    <div class="row">

      <div class="col-lg-2 d-none d-lg-block sidebar">
        {% block sidebar_esquerda %}
 
        {% endblock %}
      </div>

   
      <div class="col-12 col-lg-8">
        {% block conteudo %}
        {% endblock %}
      </div>

    
      <div class="col-lg-2 d-none d-lg-block sidebar">
        {% block sidebar_direita %}
        {% endblock %}
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  {% block scripts %}{% endblock %}
</body>
</html>
